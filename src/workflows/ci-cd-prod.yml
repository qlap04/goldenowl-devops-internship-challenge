name: CI/CD Prod

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  IMAGE:       kaise2004/goldenowl
  ECS_CLUSTER: goldenowl-prod-cluster
  ECS_SERVICE: goldenowl-prod-svc
  TASK_DEF:    goldenowl-prod
  CONTAINER:   goldenowl-prod

jobs:
  ci:
    name: Lint & Test & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install deps
        working-directory: src
        run: npm ci --frozen-lockfile

      - name: Lint
        working-directory: src
        run: npm run lint:check

      - name: Test
        working-directory: src
        run: npm test

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: ci
    environment: production   
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF }} \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name:  ${{ env.CONTAINER }}
          image:           ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service:         ${{ env.ECS_SERVICE }}
          cluster:         ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          ALB=$(aws elbv2 describe-load-balancers \
            --names goldenowl-prod-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "Testing http://${ALB}"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB}")
            if [ "$STATUS" = "200" ]; then
              echo " OK - HTTP ${STATUS}"
              exit 0
            fi
            echo "Attempt ${i}/10 - status ${STATUS}, retrying..."
            sleep 15
          done
          echo "Smoke test failed"
          exit 1
