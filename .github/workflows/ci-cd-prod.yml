name: CI/CD Prod

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: kaise2004/goldenowl
  ECS_CLUSTER: goldenowl-prod-cluster
  ECS_SERVICE: goldenowl-prod-svc
  TASK_DEF: goldenowl-prod
  CONTAINER: goldenowl-prod

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install deps
        working-directory: src
        run: npm ci --frozen-lockfile

      - name: Lint
        working-directory: src
        run: npm run lint:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install deps
        working-directory: src
        run: npm ci --frozen-lockfile

      - name: Test
        working-directory: src
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Save image to tar
        run: docker save ${{ env.IMAGE }}:${{ github.ref_name }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  scan:
    name: Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          severity: CRITICAL
          exit-code: 1

  push:
    name: Push
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: push
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF }} \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER }}
          image: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          ALB=$(aws elbv2 describe-load-balancers \
            --names goldenowl-prod-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "Testing http://${ALB}"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB}")
            if [ "$STATUS" = "200" ]; then
              echo " OK - HTTP ${STATUS}"
              exit 0
            fi
            echo "Attempt ${i}/10 - status ${STATUS}, retrying..."
            sleep 15
          done
          echo " Smoke test failed"
          exit 1
