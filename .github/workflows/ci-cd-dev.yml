name: CI/CD Dev

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-dev"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: kaise2004/goldenowl

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install deps
        working-directory: src
        run: npm ci --frozen-lockfile

      - name: Lint
        working-directory: src
        run: npm run lint:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install deps
        working-directory: src
        run: npm ci --frozen-lockfile

      - name: Test
        working-directory: src
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Save image to tar
        run: docker save ${{ env.IMAGE }}:${{ github.ref_name }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  scan:
    name: Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          severity: CRITICAL
          exit-code: 1

  push:
    name: Push
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ github.ref_name }}
